<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="Saulo G. Padilha">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#10283a">
        <animate attributeName="offset" values="0.35;0.7;0.35" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ad7ff"/>
      <stop offset="100%" stop-color="#7ad7ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.5;1.1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.1;1.7" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="16" fill="#07090c"/>
  <rect width="1200" height="220" rx="16" fill="url(#wash)"/>
  <text x="72" y="78" fill="#7ad7ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4.5">SOFTWARE &#183; GUARAPUAVA</text>
  <text x="72" y="132" fill="#f4f7fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">Saulo G. Padilha</text>
  <rect x="548" y="96" width="10" height="34" rx="2" fill="#7ad7ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.55;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="168" fill="#c5d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Sistemas, integra&#231;&#245;es e produtos que entram em opera&#231;&#227;o.</text>
  <rect x="72" y="188" width="280" height="2" fill="url(#sweep)"/>
</svg>
